server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # `/`, `/create`, `/join` resolve to their own prerendered index.html
        # (real SEO content) via the $uri/index.html check below — deliberately
        # not `$uri/`, which would make nginx 301-redirect bare directory
        # requests instead of serving the file. Anything else — the dynamic
        # /room/:code/* pages — falls back to the bare client-only shell, NOT
        # the prerendered homepage, so Angular doesn't hydrate against
        # mismatched markup.
        try_files $uri $uri/index.html /index.csr.html;
    }
}
