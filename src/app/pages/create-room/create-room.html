<div class="form-page">
  <a routerLink="/" class="form-page__back" mat-icon-button aria-label="Назад">
    <mat-icon>arrow_back</mat-icon>
  </a>

  <div class="form-page__card">
    <h1 class="form-page__title">Створити кімнату</h1>
    <p class="form-page__lead">Ви станете власником кімнати й зможете обрати бункер і катаклізм.</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ваше ім'я</mat-label>
      <input
        matInput
        [(ngModel)]="ownerName"
        (keydown.enter)="createRoom()"
        maxlength="30"
        autocomplete="nickname"
      />
    </mat-form-field>

    @if (error()) {
      <p class="form-page__error">{{ error() }}</p>
    }

    <button mat-flat-button class="full-width btn-lg" [disabled]="loading()" (click)="createRoom()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Створити
      }
    </button>
  </div>
</div>
