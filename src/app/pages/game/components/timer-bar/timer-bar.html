<div class="bar">
  <div class="bar__section">
    <div class="rounds" [attr.aria-label]="'Раунд ' + (room()?.round || 0) + ' з ' + totalRounds()">
      @for (r of roundDots(); track $index) {
        <span class="rounds__dot" [class.rounds__dot--done]="r === 'done'" [class.rounds__dot--current]="r === 'current'"></span>
      }
    </div>
    <span class="bar__round">Раунд {{ room()?.round || 0 }} / {{ totalRounds() }}</span>
  </div>

  <div class="bar__section bar__section--center">
    <span class="bar__phase">{{ phaseLabel() }}</span>
    @if (activePlayerName() && isRevealPhase()) {
      <span class="bar__active">Хід: {{ activePlayerName() }}</span>
    }
  </div>

  <div class="bar__section bar__section--end">
    @if (showTimer()) {
      <span class="timer" [class.timer--warn]="secondsLeft() <= 10">
        <span>{{ secondsLeft() }}</span><small>с</small>
      </span>
    }
    <button
      mat-icon-button
      class="bar__sound"
      (click)="toggleSound.emit()"
      [attr.aria-label]="soundOn() ? 'Вимкнути звук' : 'Увімкнути звук'"
      [matTooltip]="soundOn() ? 'Звук ходу увімкнено' : 'Звук ходу вимкнено'"
    >
      <mat-icon>{{ soundOn() ? 'notifications_active' : 'notifications_off' }}</mat-icon>
    </button>
  </div>

  @if (showTimer()) {
    <span class="bar__progress" [class.bar__progress--warn]="secondsLeft() <= 10" [style.width.%]="progress()"></span>
  }
</div>
