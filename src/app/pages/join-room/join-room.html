<div class="page">
  <a routerLink="/" class="back" mat-icon-button aria-label="Назад">
    <mat-icon>arrow_back</mat-icon>
  </a>

  <div class="card">
    <mat-icon class="card__icon">meeting_room</mat-icon>
    <h1>Приєднатись до гри</h1>
    <p class="card__hint">Введіть код кімнати, який вам надіслав власник.</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Код кімнати</mat-label>
      <input
        matInput
        [(ngModel)]="code"
        maxlength="6"
        autocomplete="off"
        inputmode="numeric"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ваше ім'я</mat-label>
      <input
        matInput
        [(ngModel)]="playerName"
        (keydown.enter)="joinRoom()"
        maxlength="30"
        autocomplete="off"
      />
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button
      mat-flat-button
      color="primary"
      class="full-width"
      [disabled]="loading()"
      (click)="joinRoom()"
    >
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Приєднатись
      }
    </button>
  </div>
</div>
