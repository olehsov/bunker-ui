<div class="form-page">
  <a routerLink="/" class="form-page__back" mat-icon-button aria-label="Назад">
    <mat-icon>arrow_back</mat-icon>
  </a>

  <div class="form-page__card">
    <h1 class="form-page__title">Приєднатись до гри</h1>
    <p class="form-page__lead">Введіть код кімнати, який надіслав власник, або відкрийте його посилання-запрошення.</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Код кімнати</mat-label>
      <input
        matInput
        class="code-input"
        [(ngModel)]="code"
        maxlength="6"
        autocomplete="off"
        inputmode="numeric"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ваше ім'я</mat-label>
      <input
        matInput
        [(ngModel)]="playerName"
        (keydown.enter)="joinRoom()"
        maxlength="30"
        autocomplete="nickname"
      />
    </mat-form-field>

    @if (error()) {
      <p class="form-page__error">{{ error() }}</p>
    }

    <button mat-flat-button class="full-width btn-lg" [disabled]="loading()" (click)="joinRoom()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Приєднатись
      }
    </button>
  </div>
</div>
